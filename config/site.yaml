site:
  title: Gadget Terminal
  title_ja: ガジェットターミナル
  tagline: 海外ガジェットの「まだ日本語で読めない話」を、毎日。
  description: スマホ・ウェアラブル、PC/自作、変わり種ガジェット。海外一次ソースを毎日クロールし、日本語で要点だけを届けるガジェットメディア。
  base_url: https://gadgetterminal.com
  lang: ja
  locale: ja_JP
  # 法人名は日本語表記を正とする。PR TIMES など日本の審査では、
  # 申請者の法人名とサイト上の運営者表記が一致しているかを見られる。
  # 英語表記だけだと照合できない。
  author: 合同会社スタープラチナ
  contact_email: info@gadgetterminal.com
  press_email: press@gadgetterminal.com
  copyright_from: 2026
  posts_per_page: 20
  # 収益化は後回し。有効化するときは true にしてタグを入れる
  # アクセス解析。Cloudflare Web Analytics（Cookie 不使用）を使う。
  # ダッシュボード → Web Analytics → サイトを追加 で発行されるトークンを入れる。
  cf_analytics_token: "a114276e3ee147cc9bcdc2edf684b9fc"
  # GA4 を併用する場合のみ。G- で始まる測定ID
  analytics_id: ""
  # Google AdSense。審査に通ると発行される ca-pub- で始まるID。
  # ここが空のあいだは広告スクリプトも ads.txt も一切出力しない。
  # 審査時の「サイト確認」でも同じスニペットを求められるので、
  # IDを受け取ったらまずここに入れて公開すればよい。
  adsense_client: ""
  # アフィリエイト（もしもアフィリエイト経由）。
  # enabled: false のあいだは代替品セクションは出るがリンクは素のURLのままで、
  # 広告表示も出さない。提携が通ってからテンプレートを貼って true にする。
  affiliate:
    enabled: true
    # Amazonアソシエイトは申請中（2026-08-31 もしも経由で再申請、2回目）。
    # プライバシーポリシーへの開示文は moshimo_amazon が空でもここが true なら出す。
    # 審査担当は「承認後にプライバシーポリシーを直す」を待ってくれない。
    # 申請時点で規約どおりの開示ができていることそのものが審査対象になる。
    amazon_applicant: true
    # もしもの管理画面で発行されるリンクをそのまま貼り、商品URLの部分を {url} に置き換える。
    # 例: https://af.moshimo.com/af/c/click?a_id=0000000&p_id=00&pc_id=00&pl_id=0000&url={url}
    # 承認されたらここを埋める。埋まった瞬間、プライバシーポリシーの文言は
    # 「参加を予定」から正式な規約文言「適格販売により収入を得ています」に自動で切り替わる。
    moshimo_amazon: ""
    moshimo_rakuten: "https://af.moshimo.com/af/c/click?a_id=5765003&p_id=54&pc_id=54&pl_id=616&url={url}"
    moshimo_yahoo: ""
    # 景品表示法（ステマ規制）で必須の表示。リンクがある記事に自動で出る。
    disclosure: この記事にはアフィリエイト広告を含みます

  # 楽天市場で商品を検索するためのID（scripts/find_rakuten_alt.py が使う）。
  # 楽天ウェブサービスで無料発行できる。パスワードではないので公開のままでよい。
  rakuten_app_id: "426d0238-4559-4562-84cd-0ebadd9809ff"

categories:
  smartphone:
    label: スマホ・ウェアラブル
    code: MOB
    slug: smartphone
    description: 新型スマホ、リーク、スマートウォッチ。海外発表から日本上陸までの間を埋める。
  pc:
    label: PC・周辺機器・自作
    code: PCS
    slug: pc
    description: ミニPC、GPU/CPU、キーボード、モニタ。ベンチと価格の実数を軸に。
  weird:
    label: 変わり種・クラファン
    code: ODD
    slug: weird
    description: Kickstarter・Makuake発の新製品、珍デバイス、小型端末。日本語情報がほぼ無い領域。

