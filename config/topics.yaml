# 話題ページ(/topic/<slug>.html)。2026-11-10 本人了承。
# 記事のタグは836種類あり表記もばらばら(「携帯ゲーム機」「レトロゲーム機」「ANBERNIC」など)なので、
# タグをそのままページにせず、ここで話題ごとにまとめる。タグの一致は大文字小文字を区別しない。
# 記事が min_posts(既定5)本に満たない話題はページを作らない(中身の薄いページを増やさないため)。
# 話題を足すときは、label・desc(1〜2文、事実だけ)・tags(完全一致)を書く。contains は「その言葉を含むタグ」も拾う。
