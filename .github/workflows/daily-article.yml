name: 毎朝の記事下書きを作って公開

on:
  # 収集(collect.yml)が終わったら続けて走る。自前の cron は持たない。
  #
  # GitHub の定時実行は混雑で大きく遅れる。2026-09 下旬から毎日2〜3.5時間遅れ、
  # 06:00 指定の記事生成が 09:00〜09:40 に走って、朝の通勤時間に間に合わなかった。
  # 収集と記事生成がそれぞれ別々に遅れると順番も崩れるので、cron は収集の1本だけに
  # して早めに置き(02:30 JST)、記事生成はその完了を合図に続ける。
  # (workflow_run の連鎖は3段まで。収集→記事生成→公開(deploy.yml)でちょうど3段)
  workflow_run:
    workflows: ["日次ダイジェスト収集"]
    types: [completed]
    # 以下は 06:00 固定だったころの時刻の理由。狙い(朝の通勤前に出す)は今も同じ。
    #
    # この時刻の理由:
    # - 海外ガジェットのニュースは米国の営業時間 (= 日本の深夜〜早朝) に出る。
    #   朝に生成すると、その日いちばん新しい状態で書ける。
    # - ビルドと公開まで含めて 06:30 頃には反映されるので、
    #   日本の通勤時間帯 (7〜9時) の前に読める状態になる。
    # - 生成は本人の Claude 利用枠を消費する。就寝中に済ませることで
    #   日中のローカル作業と5時間ウィンドウを取り合わない。
  workflow_dispatch:
    inputs:
      url:
        description: "記事にしたい製品のURL（空なら通常どおり自分で探す。複数はカンマ区切り）"
        required: false
        default: ""

# 日本上陸の見回り(followup.yml)と同時に走って push が衝突しないよう直列にする
concurrency:
  group: content-push
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: 記事執筆前の HEAD を記録(新着記事の差分検出に使う)
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Claude Code CLI を明示的にインストール
        # claude-code-action@v1 内蔵のネイティブインストールが、install.sh の
        # 失敗(ネットワーク瞬断など)を握りつぶして「成功」扱いのまま
        # バイナリを置かないまま進み、後段で
        # 「Claude Code native binary not found at ~/.local/bin/claude」で
        # 落ちる既知の不具合がある(upstream issue #1242, #1290)。
        # 2026-09-09 の実行がこれで全滅した(19秒で失敗)ため、自前で
        # インストールして PATH に通しておく。set -euo pipefail を効かせて
        # curl の失敗が握りつぶされずこのステップ自体で落ちるようにする。
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - uses: anthropics/claude-code-action@v1
        # prompt の中に ${{ }} を書かないこと。書くとプロンプト全体が式として
        # 評価され、GitHub Actions の式の上限 21,000字にぶつかって
        # 「Invalid workflow file / Exceeded max expression length」で落ちる。
        # 値はここで env に渡し、プロンプト側は環境変数として読む。
        env:
          MANUAL_URL: ${{ github.event.inputs.url }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # --max-turns は余裕を持たせる。画像収集（imagepick → ダウンロード →
          # 1枚ずつ目視 → checkimages）で1記事あたりのターン数が大きく増えた。
          # 実測: 記事3本 + 画像で150ターン（120では足りず失敗扱いになった）。
          # 記事は書けているのに上限超過で落ちるので、超えたらここを上げる。
          claude_args: |
            --max-turns 250
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash"
          prompt: |
            あなたは合同会社スタープラチナが運営する海外ガジェットメディア「Gadget Terminal」
            (https://gadgetterminal.com/) の編集担当です。記事を3本書いて、
            content/posts/ にコミットしてください。

            記事は毎朝1回、3本まとめて公開する。**本数を増やすことは目的ではない。**
            新規ドメインで大量に記事を積むと、Google の「スケーリングされたコンテンツの
            不正使用」ポリシーに触れる形になる。判定されるのは量ではなく
            「価値を足しているか」なので、3本それぞれで日本の読者にとっての
            固有の価値（法規制・入手性・代替品）を必ず出すこと。
            **薄い記事を3本出すくらいなら2本に減らしてよい。**
            **ただし0本で終わってはいけない。** 本数を減らしてよいのは、候補を十分に見たうえで
            の話である。ある候補が書けない（価格が未公表・画像が無い・元記事が取れない）なら、
            見送って次の候補に進む。ダイジェストの全候補（毎日30件以上ある）と手順4の
            ソースまで見て、それでも書けるものが無いときに限って本数を減らす。
            （2026-09-30、ダイジェストに38件あったのに6件ほど見ただけで0本で終わり、
            その日の記事が1本も出なかった。本人の指摘で発覚）

            ## この媒体の軸
            業界ニュースではなく「ガジェットそのもの」を扱う。とくにクラウドファンディング発の
            新製品（Kickstarter / Indiegogo / Makuake など）を最優先。
            決算・訴訟・株価・市場シェアといった業界ニュースは扱わない。

            ## 手順

            1. 日本時間の今日の日付を求める。`TZ=Asia/Tokyo date +%Y-%m-%d` を実行すること。
               以下これを <TODAY> と呼ぶ。

            2. リポジトリ内の docs/PLAYBOOK.md を読む。記事の型・禁止事項・クラファン案件の
               追加ルール・画像の扱いが書いてある。これが最優先の基準。

            3. リポジトリ内の data/digest/<TODAY>.md を読む。無ければ前日の日付で探す。
               `【クラファン】` が付いた項目を優先する。

            3-2. 【最優先】書くネタの優先順位を決める。上から順に埋め、3本に達したら
               それ以降は見なくてよい。

               (1) **手動指定** — この実行に渡された url は環境変数 MANUAL_URL に入っている。
                   まず `echo "$MANUAL_URL"` を実行して中身を確認すること。
                   空でなければ、**それだけを記事にして終わる。** 3本に水増ししない。
                   カンマ区切りなら全部書く。URL の指定があるのに別の製品を書いてはいけない。
                   この場合は下の (2)(3)(4) もダイジェストも見ない。

               (2) **キュー** — data/queue.md を読む。`## 未処理` の下にある `- ` で始まる行が
                   あれば、上から順に最大3本まで取る。行の URL 以降に書かれた文字列は
                   切り口の注文なので、記事に反映する。

                   **`- [2026-08-24] https://...` のように日付が付いている行は、
                   その日付になるまで取らない。** <TODAY> より後の日付なら飛ばして
                   次の行を見る。飛ばした行は `## 未処理` に残す（処理済みにしない）。
                   日付が <TODAY> 以前なら通常どおり取る。

               (3) 上の 3 で読んだダイジェスト。末尾の「## 日本発売（国内プレスリリース）」は
                   海外メーカーの製品が日本で発売・予約開始・国内クラファン開始になった知らせ。
                   **ここから書くのは1日1本まで**（3本のうちの1本として数える）。
                   日本語で検索する人が増えるのは日本で発売されたときなので、そこを取りに行く。
                   ただしプレスリリースの書き写しは価値ゼロで、大手媒体にも勝てない。
                   docs/PLAYBOOK.md の「2.6 日本発売の記事」の条件を満たすものだけ書く。
                   満たせなければ書かずに他の候補に回す。
                   その製品の記事が content/posts/ に既にあるなら、新しい記事は書かず、
                   その記事の front matter に japan（日本上陸の続報）を足す（本数には数えない）。

               (4) 下の 4 の方法で自分で探す

               **(1) と (2) から書いた記事には front matter に `pick: true` を付ける。**
               運営者が自分で選んだ記事という意味で、サイト上は「編集部ピックアップ」として
               別枠に出る。(3)(4)（ダイジェストや自分で探したもの）には付けない。
               ここを取り違えると、自動選定した記事を人が選んだことにしてしまう。

               キューの行に **`> ` で始まる続きの行**があれば、それは運営者本人が書いた
               コメントである。**その文をそのまま `pick_note` に入れる。**
               要約も、語尾の調整も、敬体への変換もしない。本人の言葉なので手を入れない。
               `> ` の行が無ければ `pick_note` は書かない（空で出すより出さないほうがよい）。

               キューを消化した場合、記事を書き終えたあとに data/queue.md を更新する。
               手順は下の 10 に書いてある。

            4. ダイジェストが無い、またはクラファン案件が少ない場合は自分で探す。
               - https://www.makuake.com/sitemap/project/9/ （末尾が新着）
               - https://liliputing.com/feed
               - https://www.cnx-software.com/feed/
               - https://www.gizmochina.com/feed/
               - https://newatlas.com/index.rss
               - https://www.geeky-gadgets.com/feed/
               - https://www.yankodesign.com/feed/
               - https://hackaday.com/blog/feed/

            5. 候補を選ぶ。本数は 3-2 で決めた優先順位に従う（手動指定があるときは
               指定された本数、無ければ3本）。製品そのものの話を優先。カテゴリ
               （smartphone / pc / weird）が偏らないようにする。
               content/posts/ の既存ファイルを見て重複を避ける。
               ただし 3-2 (1)(2) で指定されたネタは、カテゴリの偏りを理由に外さない。

               【SEO】「日本語記事が無い」だけでなく「日本語で検索されそうか」も見る。
               製品名で検索する人がいる見込みが立つものを選ぶ。判断材料:
                 - 固有の製品名があるか（型番・ブランド名。「新型ミニPC」のような一般名詞は弱い）
                 - 価格や発売日が確定しているか（買うかどうか調べる人がいる）
                 - 日本で使えるかが論点になるか（技適・電圧・国内流通）
               逆に、調査レポートや訴訟・市場動向は検索需要が細いので優先度を下げる。

               【X】同じくらいの候補なら、X で見られやすいものを選ぶ（2026-10-04 実績）:
                 - 日本でも名前が知られたブランド・製品の新作（Valve の Steam Frame、iPhone 関連）
                 - レトロ携帯ゲーム機（ANBERNIC・AYANEO・Retroid など）。安くて日本でも買える物は特に強い
                 - 一言で説明できる意外な仕組み、桁違いの価格
                 これは選び方の傾きであって、この3種だけにするという意味ではない

               【重要】本数の決め方。`ls content/posts/<TODAY>-*.md | wc -l` で今日の本数を数えて:
               - **3本以上ある** → 「本日分は作成済みのため終了」と出して何もせず終了
               - **3本未満** → 既存の記事とは別の製品を選んで、3本になるまで書く
               手動実行 (event_name = workflow_dispatch) は本数に関わらず必ず書く。
               この実行の event_name は環境変数 EVENT_NAME に入っている。
               `echo "$EVENT_NAME"` で確認すること。

            6. 元記事を必ず読む。見出しだけで書かない。
               スペック・価格・日付・調達額を正確に抜き出す。

               まず WebFetch を使う。**403 が返る、または本文が取れない場合は Bash の curl に
               切り替える。** WebFetch の UA を弾くサイトがある（Kickstarter は実測で403、
               curl に一般的なブラウザの UA を付ければ 200 で取れる）:

                 curl -4 -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" "<URL>" -o /tmp/p.html

               取得できたら python3 で必要な箇所を抜く。**HTMLを全部読もうとしない**
               （数十万バイトある）。og:title / og:description / og:image のメタタグと、
               必要な数値だけを正規表現で拾う。

               Kickstarter の場合、HTML 内に埋め込まれた JSON（実体参照 `&quot;` で
               エスケープされている）に正確な値がある。使えるキー:
                 goal / pledged / backers_count / state / deadline / currency / country
               - **`currency` を必ず読む。USD とは限らない。**（実測例: Nimbo X1 は
                 香港のプロジェクトで HKD 建て）。確認せず「$」を付けると金額が数倍ずれる
               - deadline は UNIX 時刻（秒）。JST に直して「◯月◯日まで」と書く
               - state が "live" でなければ募集は終了している。その事実を記事に必ず書く
               - 達成率は pledged ÷ goal。**取得時点の値であることを明記する**

               **Indiegogo は curl でも数値が取れない**（JSで描画するため）。HTML内の
               `window.__INITIAL_STATE__ = {...}` に JSON があるので、そこから読む:
                 - projectState.statistics.backersCount / fundsGathered
                 - projectContext.project.campaignStart / campaignEnd / name
                 - **通貨は checkoutCurrencies[0].shortName を必ず確認する。**
                   USD とは限らない（実測例: HOVERAir VERSA は HKD 建て）。
                   通貨を確認せず「$」を付けると金額が数倍ずれる。
               抜き出しは `json.JSONDecoder().raw_decode()` を使うと確実
               （`window.__INITIAL_STATE__ =` の直後から復号する）。

               curl でも取れないソースは諦めて別のネタに移る。推測で書かない。
               **とくに金額・重量・日付は、取れた値だけを書く。** 取れなければその項目を
               書かない。「約」「とみられる」で埋めるのは捏造と同じ扱いにする。

            7. 各記事に実物が見える動画を1本つける。
               a. WebSearch で「<製品名> YouTube review」「<製品名> hands-on」等を検索
               b. 必ず存在確認する。次を WebFetch して title と author_name が返ることを確認:
                  https://www.youtube.com/oembed?url=https%3A//www.youtube.com/watch%3Fv%3D<動画ID>&format=json
                  エラーが返るIDは絶対に使わない
               c. front matter に embeds として書く
               d. 別製品の動画は貼らない。「同じシリーズの前世代」は別製品。
                  無ければ embeds を省略する

            7-2. 【必須】製品画像を集める。**画像が1枚も無い記事は公開しない。**
               ガジェットメディアで実物が見えない記事は成立しない。ここは省略不可。

               a. 画像を探すページは「公式」に限る。
                    - メーカーの公式製品ページ・公式プレスルーム
                    - Kickstarter / Indiegogo / Makuake のプロジェクトページ
                  ニュースサイトが載せている画像は使わない（転載になる）。

               b. 収集にはこのリポジトリのツールを使う:
                    python3 scripts/imagepick.py <公式ページURL> --match "<製品名>" --max 6
                  --match は必ず付ける。付けないと**他製品のナビ画像を拾う**。
                  （実測: Keychron の公式ページから Q5 / Q6 / K2 / V5 の画像が出た）

               c. 【最重要】採用する画像は、1枚ずつ実際に開いて目で見る。
                    curl -sL -o /tmp/c1.jpg "<画像URL>"
                  そのうえで Read ツールで /tmp/c1.jpg を開いて中身を確認する。
                  次のものは**必ず落とす**:
                    - 販促バナー・クーポン・「VIP ACCESS」等の文字だけの画像
                    - 別製品、別世代の写真
                    - 他媒体のロゴや透かしが入った画像
                    - 人物が主題の画像
                  （実測: ファイル名に製品名が入っていても中身は販促バナーだった）

               d. front matter に、確認できた枚数だけ全部書く。1枚だけにしない。
                    images:
                      - url: "https://.../front.jpg"
                        caption: 本体前面。スイッチは交換可能
                      - url: "https://.../spec.png"
                        caption: 主な仕様
                    credit: メーカー名 公式製品ページ
                  caption は**自分が見た内容**を書く。見ていないものを書かない。
                  credit は必須。1枚目が記事とカードのメイン画像になる。

               e. そのページのURLを sources にも入れる。

               f. 公式画像がどうしても見つからない場合は、その製品の記事を**書かない**。
                  別のネタに差し替える。画像なしで出すより、本数が減るほうがよい。

               画像ファイルをダウンロードして public/ や content/ に置くことは絶対にしない。
               確認用に /tmp へ落とすのはよい。front matter には権利者のURLを書く。

            7-3. 【毎回2本まで】過去記事の画像を埋める。
               サイト開設初期の記事には画像が無いものが残っている。次で一覧を出す:
                 python3 scripts/checkimages.py | grep -E '^(NG|△)'
               上から**2本まで**選び、7-2 と同じ手順（imagepick → 目視 → images）で
               画像を足す。3本以上は手を出さない。今日の新記事のほうが優先である。
               公式ページが見つからない古い記事は飛ばして、次の記事に移る。
               画像を足したファイルは、今日の記事と同じコミットに含めてよい。

            7-4. 【毎回2本まで】過去記事に buy（本国から直接買う導線）を足す。
               収益リンクが1本も無い記事が40本以上残っている。国内に流通しない
               製品を扱っているためで、記事の質の問題ではない。次で一覧を出す:
                 python3 scripts/checklinks.py --missing-buy | grep '^NG' | head -8
               上から見て、**メーカー公式ストアやクラファンのページが実在し、
               日本へ発送するもの**を2本まで選んで buy を足す。書式と giteki の
               ルールは下の 8 と docs/PLAYBOOK.md の 2.8 にある。

               次のような記事には buy を足せない。飛ばして次に移ること:
                 - 業界ニュース・調査レポート（買える「製品」が無い）
                 - 発売前・コンセプト機（買う手段が無い）
                 - 販売が終了している、在庫が無い
                 - 技適の判定が「取得済み/対象外/未取得」のどれとも言い切れない
               **1本も足せない日があってよい。** 無理に埋めない。

            8. 記事を書く。ファイル名は content/posts/<TODAY>-<slug>.md
               front matter: title / seo_title / x_hook / slug / keyword / category / date /
                             kicker / tags / buy / alternatives / faq / embeds / sources /
                             images / credit（7-2 で集めた製品画像。**必須**）/
                             origin / deadline（到着案内板に出る。下記）
                             （キュー・手動指定から書いた記事のみ pick / pick_note）
               - keyword はアイキャッチに入る短い語（製品名など全角10文字程度まで）

               【到着案内板】トップの案内板は「どこから来て、今どうなっているか」を出す。
                 - origin: 製品を出した会社の本拠地。`空港コード 都市名` の形で書く
                     origin: SZX 深圳
                   クラファン案件は API の country が正解なので、それに従う。
                   （Kickstarter は project JSON の `country`、Indiegogo は
                     `window.__INITIAL_STATE__` 内の国コード）
                   **分からなければ書かない。** 空欄なら案内板は「---」と出る。
                   推測で埋めると出所を偽ることになる。ここは事実なので外さない。
                   有名ブランドは config/site.yaml の origins から自動で引けるので、
                   その表に載っている会社は書かなくてよい。載っていなければ書く。
                 - deadline: クラウドファンディングの締切。`YYYY-MM-DD`
                     deadline: 2026-09-11
                   これを書くと案内板が自動で NOW BOARDING / FINAL CALL（残り7日以内）/
                   GATE CLOSED に切り替わる。**クラファン案件では必ず書く。**
                   Kickstarter は project JSON の `deadline`（UNIX秒）をJSTに直す。
                 - status: 上記で表せない状態だけ手で書く。使える語は
                   SCHEDULED / LANDED / LOCAL ONLY / FULLY BOOKED / DELAYED。
                   status_note に「残り3日」「品切れ」など短い補足を書ける。

               【SEO】seo_title を必ず書く。検索結果に出るのはこちら。
                 - 全角32字以内。Google はこれ以上を切り捨てる
                 - 製品名を先頭に置く。「〜が話題」「〜がすごい」は書かない
                 - 日本の読者が実際に打つ語を1つ入れる（価格 / 日本 / 技適 / 発売日 / スペック）
                 - **title・seo_title・kicker に否定の結論を書かない。**（kicker は検索結果の説明文にもなる） 「日本未発売」「日本の価格と
                   発売日は未発表」「技適は未確認」「日本発売は未定」「日本発送なし」「今は買えない」
                   のように、日本では手に入らないことが最初に目に入ると、読者はクリックしない
                   （2026-09-30 本人の指摘）。締めは価格・スペック・発売日など魅力のある事実にする。
                   「日本」「技適」の語を入れたいときは、答えを書かずに問いの形にする。
                   例: 「Sensei Proは179.99ドル、日本発売は？」「ThinkNode M9は75ドル、日本で使える？」
                   答え（技適が未確認、日本発売は未定など）は本文と FAQ で言い切る
                 - title は長くてよい（記事ページの見出しとして情報量を優先する）
                 例: title  「Framework Laptop 12がIntel Core Series 3とThunderbolt 4に対応、DIY版549ドルから」
                     seo_title 「Framework Laptop 12がCore Series 3に対応、549ドルから」

               【X用】x_hook を必ず書く。X に投稿するときの一言目になる。
                 - 全角100字程度まで(2026-09-05に60字から120字に拡張し、2026-10-04に100字へ。
                   一文で終わらせず、興味を持って記事まで読みに行きたくなる長さを取る。
                   投稿は本文に記事URL(23字ぶん)とハッシュタグを足して1通にするので、
                   120字だとXの280字の枠を超えてハッシュタグが落ちる)。
                   **seo_title を使い回さない。** 検索に効く言葉と、指を止める言葉は別物である
                 - 製品名から書き始めない。読者が「え？」と思う事実から入る
                 - 数字・重量・価格・法規制など、具体的な事実を2点ほど重ねて、続きが
                   気になる引きを作る。1点だけで終わらせない。形容詞や誇張で盛らない
                 - 「話題」「すごい」「衝撃」「ヤバい」は使わない
                 - 製品名は必ず入れる（書き出しでなくてよい）。無いと何の話か分からない
                 - **x_hook は「欲しい」「読みたい」と思わせる役に徹する。注意点は書かない。**
                   技適が未確認・日本未発売・日本に発送しない・Androidが無い・性能は未検証
                   といった話は、記事の本文と FAQ で書く（そこでは今までどおり言い切る）。
                   「ただし」「〜だが」で後半を否定に落とさない。締めは価格・発売時期・
                   いちばん魅力のある事実にする。
                   （2026-09-30 本人の指摘。「BOOXなのにAndroidが入っておらず、Kindleアプリも
                   使えない。国内代理店が扱うかは告知されていない」のように悪い情報を並べた
                   投稿文では、誰も欲しいと思わない。直近の投稿文の多くがこの形だった）
                 - 誇張はしない。魅力は事実で語る（盛らない、が変わるわけではない）
                 - **実際に X でよく見られた投稿の型**（2026-10-04 本人が閲覧数を調べた結果）。
                   書き出しはこの4つのどれかに寄せる:
                   (a) 日本の読者が既に知っている物に結び付ける。iPhone・Steam・ゲームボーイ・
                       キーボードケースのように、名前を聞けば絵が浮かぶもの
                       「iPhone用キーボードケースの会社が作る初の自社スマホが、〜」
                   (b) 仕組みが一言で絵になる意外性
                       「体に何も装着せず、部屋の隅に置いた箱1台がNPUで骨格を読み取る。」
                   (c) 知っている物 × 桁違いの値段
                       「普通のiPhone 18 Proが、背面パネルを24Kゴールドや鍛造カーボンに
                       張り替えるだけで7,130ドルになる。」
                   (d) 日本で円で買える。国内の販売価格(円)があるなら必ず入れる
                       （Steam Frame の国内発売、ANBERNIC RG 35 の日本語ストア 6,299円が
                       よく見られた）
                   逆に、スペックの数字だけを並べた書き出しは見られていない
                 例: seo_title 「HOVERAir VERSAが230gで登場、手持ちと自律飛行の2-in-1」
                     x_hook    「230gのカメラ「HOVERAir VERSA」は、手に持って撮っても、
                     手を離して自律飛行に切り替えても撮れる。価格は399ドルから」

               【読者価値】alternatives を書く。クラファン案件と国内未発売品は必須。
               「面白いが今は買えない」で終わらせず、読者が今日取れる行動を示す。
                 - 同じ用途を満たし、日本で今すぐ買える製品を1〜2件挙げる
                 - why に「なぜ代替になるか」を1行で書く。技適取得済み・国内保証など
                 - url は Amazon.co.jp か楽天市場の商品ページ。**実在を WebFetch で確認する**
                 - 【重要】**2026-09-16 時点で提携できているのは楽天市場と Amazon の2つ。**
                   `merchant` に書いてよい値は **rakuten** か **amazon**。
                   **運営の指定で、同じ製品が両方にあるなら Amazon を優先する。**
                   楽天を選ぶのは、Amazon に妥当な商品が無い（転売価格・並行輸入・出品なし等）
                   場合に限る。**yahoo はまだ未提携**で、`merchant: yahoo` と書いても
                   報酬は発生せず素のリンクになる。
                   （2026-08-16〜28、当時未提携だった amazon を条件つきルールの隙間で
                     20記事すべてに書いてしまい12日間ゼロ円になった事故がある。
                     条件つきのルールを書かないこと。）
                 - URL は商品ページであること（`item.rakuten.co.jp/店舗/商品コード/` または
                   `https://www.amazon.co.jp/dp/XXXXXXXXXX` 形式）。検索結果ページは変換されない
                 - 2件目を書く場合、楽天・Amazon以外（メーカー直販など）でもよい。
                   **その場合 merchant は書かない。** 素のリンクとして出力される。
                 - **楽天にもAmazonにも妥当な商品が無ければ、merchant を書かずに素のリンクにする。**
                   転売価格・怪しい並行輸入・中古しか無い場合がこれにあたる。
                   報酬のために読者へ不利な店を勧めるのは本末転倒である。
                   収益リンク0本の記事があってよい。捏造や粗悪な誘導よりずっとよい。
                 - 適切な代替品が無ければ書かない。無理に埋めない
                 - **image(製品写真のURL)は必須。** 無いと「今すぐ買えるオススメガジェット」
                   欄で写真の無い枠になり、押されない。checklinks.py が NG にして公開が止まる。
                   手順: まず `python3 scripts/find_alt_images.py --apply` で楽天から探す。
                   見つからない・別物が出た場合は、その製品のメーカー公式ページの
                   og:image や製品写真のURLを使う(他のニュースサイトの画像は使わない)。
                   **どちらの場合も、画像をダウンロードして Read で開き、その型番の本体で
                   あることを目で確かめる。** 楽天の検索は付属品(ケース・フィルム)や
                   上位機種(Pro など)・別世代を拾うことが多い(実例: BOOX Palma 2 を
                   探して Palma 2 Pro が出た)。確かめられなければ別の代替品に替える
               書式:
                 alternatives:
                   - name: 製品名
                     why: 技適取得済みで国内在庫あり。同じ用途を今日から使える。
                     url: https://item.rakuten.co.jp/shopname/itemcode/
                     merchant: rakuten
                     image: "https://.../製品写真.jpg"

               【読者価値】buy を書く。alternatives が「今すぐ国内で買える**別の**製品」
               なのに対し、buy は「**その製品そのもの**を本国から直接買う」導線である。
               この媒体が扱う製品の多くは国内に流通しないため、代替品だけでは
               「その製品をどう買うか」に答えられない。メーカー公式ストアや
               クラファンのページが日本へ発送するなら、必ず書く。

                 - **giteki は必須。書ける値は「取得済み」「対象外」「未取得」の3つだけ。**
                   取得済み = 技適を取っている / 対象外 = そもそも電波を出さない /
                   未取得 = 技適が無い（有線でのみ使える。警告文はコードが自動で入れる）
                 - **確認が取れないなら buy ごと書かない。**「未確認」という値は無い。
                   判定の無い項目はビルドがリンクごと落とし、checklinks.py が NG にする
                 - merchant に書けるのは minisforum / aliexpress だけ。それ以外の
                   メーカー直販は merchant を書かず素のリンクにする（報酬は出ないが、
                   「どこで買えるか」は収益と無関係に読者が必要とする情報である）
                 - ships_jp は日本へ発送する場合だけ true
               書式:
                 buy:
                   - name: 製品名
                     merchant: minisforum
                     url: https://store.minisforum.com/products/xxx
                     price: 1,439ドル（掲載時点）
                     ships_jp: true
                     giteki: 未取得
                     note: 送料・関税・保証の注意

               【SEO】faq を2〜4問付ける。FAQPage 構造化データとして出力され、
               検索結果に Q&A が展開されることがある。ガジェットは以下が定番クエリ:
                 - 「日本で買えますか」「技適は取得していますか」「いくらですか」
                 - 「いつ発売されますか」「日本語に対応していますか」
               記事本文で答えている内容を、質問形に言い換えて書く。
               **本文に無いことをFAQで答えてはいけない。** 事実の捏造と同じ扱いにする。
               書式:
                 faq:
                   - q: 日本で買えますか
                     a: 掲載時点で日本向けの販売は告知されていません。
               - 元記事に無い数字を書かない／リークはリークと明記／円換算はしない
               - クラファン案件は「まだ製品ではない」ことを必ず書く。納期遅延・仕様変更の
                 リスク、調達額は取得時点の値であること
               - 「日本から見るとどうか」を必ず入れる（技適・PSE・電波法、国内流通、価格）
               - **「日本では発売されていない」「国内代理店は確認できない」と書く前に、
                 日本語で必ず検索する。** WebSearch で「<製品名> 国内 発売」と
                 「<製品名> Makuake」の2回。海外メディアだけを読むと、国内の発表を
                 見落とす。実際に BenQ iScreenBar・Razer Prio・Smartlet One の3本で、
                 公開の前日までに国内発売やMakuake開始が発表されていたのに
                 「日本では未発表」と書いてしまった（2026-09-27 に発覚）。
                 国内発表があれば、本文の「日本から見るとどうか」にそれを書き、
                 docs/PLAYBOOK.md の japan（日本上陸の続報）も付ける
               - 既存記事（content/posts/ の .md）を1本読んで、front matter の書式と
                 文体を合わせること

            9. 【重要】書いたら必ず検証する。次を順に実行し、両方通ってからコミットすること。
               a. python3 -c "import yaml,glob;[yaml.safe_load(open(f,encoding='utf-8').read().split('---',2)[1]) for f in glob.glob('content/posts/<TODAY>-*.md')]"
                  → front matter のYAMLが壊れていないか。英語タイトルにコロン(:)が含まれる場合は
                    必ずダブルクォートで囲むこと。ここが最も壊れやすい。
               b. pip install -r requirements.txt --break-system-packages -q && python3 scripts/build.py
                  → 「記事 N本」の N が、書いた本数だけ増えていることを確認
               c. **全記事に製品画像があることを確認する。ここは絶対に飛ばさない。**
                  python3 scripts/checklinks.py content/posts/<TODAY>-*.md
                  → merchant が未提携（amazon / yahoo）の記事があれば失敗する。
                    失敗したら楽天の商品ページに差し替えるか、merchant を消す。
                    **「収益リンク0本」の△だけなら合格。** 楽天に妥当な商品が
                    無いのに無理に埋めるほうが有害なので、そこは止めない。
                  python3 scripts/checklinks.py content/posts/*.md
                  → 7-4 で buy を足した過去記事も含めて検査する。buy の giteki が
                    「取得済み/対象外/未取得」以外なら NG になる。NG が出たら
                    その buy を消す（確認が取れない無線機を買わせない）。
                  python3 scripts/checkimages.py content/posts/<TODAY>-*.md
                  → 画像が無い記事、URLが死んでいる画像があれば失敗する。
                    失敗したら 7-2 に戻る。画像を用意できない記事は削除して本数を減らす。
                    **画像なしのまま公開してはいけない。**
               a〜c のどれかが失敗したら記事を直して、通るまでコミットしない。

            10. 検証が通ったら git でコミットして main に push する。
                コミットメッセージは「記事N本追加 <TODAY>」（N は実際に書いた本数）。
                7-3（画像）・7-4（buy）で直した過去記事も同じコミットに含めてよい。
                public/ ディレクトリはコミットしない（ビルド生成物のため）。

                【キューを消化した場合】記事と同じコミットに data/queue.md の更新を含める。
                - 記事にした行は `## 未処理` から消し、`## 処理済み` の下に移す。書式:
                    - 2026-08-22 https://... → content/posts/2026-08-22-slug.md
                - 記事にできなかった行（元記事が404、内容が媒体の軸から外れる等）は
                  `## 保留` に理由を添えて移す。書式:
                    - https://... — 元記事が404。取得できず
                  **黙って消してはいけない。** 本人が積んだネタが理由も無く消えると、
                  積んだこと自体を信用できなくなる。
                - 記事を書けなかった行は `## 未処理` に残す（翌日また試される）

            ## 注意
            - 事実の捏造は絶対にしない。動画IDも必ず存在確認してから使う。
            - 情報が取れないソースがあっても止まらず、取れたもので進める。
            - 3本揃わない場合は、書けた本数だけコミットして、理由をログに書く。
              0本は、ダイジェストの全候補と手順4のソースを見終えた場合だけ許される。
              見送った候補を件数つきで全部ログに挙げること（6件見て終わり、は不可）。
              **1本・2本で終えるときも同じ。** 手順4のソース（Makuake のサイトマップを含む）を
              すべて見終えるまでは、3本に届かないまま終えてはいけない。
              （2026-10-05、32件のうち6件だけ読み、手順4の半分を見ないまま1本で終えた）
            - **「中国国内のみの発売」「日本との接点が無い」は見送る理由にならない。**
              海外で出て日本語記事がまだ無い製品こそ、この媒体の本線である。日本で買えない
              製品でも、技適・入手手段・代替品を書けば日本の読者にとっての価値になる。
              見送ってよいのは、日本語の記事が既に多い・リークだけ・業界ニュース・国内メーカー品・
              元記事が読めない・画像が用意できない、のどれかに当たる場合。
              見出しだけで見送らず、候補になりうるものは元記事の冒頭まで読んで判断する。
              （2026-10-05、「中国国内のみの発売」を理由に約20件を見出しだけで外していた。
              Hisense A10・Xiaomi の磁気スピーカー・Legion C700 など、過去に普通に書いてきた種類である）

      - name: X 自動投稿アプリへ新着記事を通知
        # このステップが失敗しても記事の公開自体は既に成功しているので、
        # ジョブ全体を失敗扱いにはしない(X連携だけの問題として切り離す)。
        continue-on-error: true
        env:
          GADGET_INGEST_TOKEN: ${{ secrets.GADGET_INGEST_TOKEN }}
        run: |
          pip install -r requirements.txt --break-system-packages -q
          python scripts/notify_x.py "${{ steps.base.outputs.sha }}" \
            "https://tamakostock.web.app/api/ingest-gadget" \
            "$GADGET_INGEST_TOKEN"
