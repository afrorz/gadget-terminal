name: 日次ダイジェスト収集

on:
  schedule:
    # JST 02:30 (UTC 17:30)。終わると記事生成(daily-article.yml)が続けて走る。
    # 海外ガジェットのニュースは米国の営業時間(= 日本の深夜〜早朝)に出るので、本当は
    # 05:30 に拾いたい。ただ GitHub の定時実行は毎日2〜3.5時間遅れるため、
    # 3時間早めに置いて、実際に走るのが 04:30〜06:00 ごろになるようにしている。
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 収集
        run: python3 scripts/collect.py --top 30

      - name: ダイジェストをコミット
        run: |
          git config user.name  "gadget-signal-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "digest: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: ダイジェストをArtifactとして保存
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: data/digest/
          retention-days: 30
