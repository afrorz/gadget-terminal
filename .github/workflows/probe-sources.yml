name: 取材先に届くかを試す(手動)

# GitHub のサーバーから、記事の取材先(Kickstarter など)が読めるかを確かめるための
# テスト用。手で動かすだけで、定時実行はしない。Claude の利用枠は使わない。
# 2026-10-18: 朝の記事生成で Kickstarter・cnx-software が 403 になり、記事が1本に
# とどまった件の調査で作った。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 各URLの応答を確かめる
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          KS="https://www.kickstarter.com/projects/sparkring/spark-ring-the-smart-ring-built-to-capture-ideas-instantly"
          probe() {
            # $1: 名前 / $2: URL / $3: UA を付けるか(ua|none)
            if [ "$3" = "ua" ]; then
              out=$(curl -s -L -o /tmp/body -w "%{http_code} %{size_download}" --max-time 25 -A "$UA" -H "Accept-Language: en-US,en;q=0.9" "$2" || echo "ERR 0")
            else
              out=$(curl -s -L -o /tmp/body -w "%{http_code} %{size_download}" --max-time 25 "$2" || echo "ERR 0")
            fi
            title=$(grep -o -m1 '<title>[^<]*' /tmp/body 2>/dev/null | head -c 80 | sed 's/<title>//')
            echo "| $1 | $3 | $out | ${title:-$(head -c 80 /tmp/body | tr -d '\n')} |"
          }
          echo "| 対象 | UA | 応答 サイズ | 中身の先頭 |"
          probe "KS プロジェクトページ" "$KS" ua
          probe "KS プロジェクトページ" "$KS" none
          probe "KS FAQ" "$KS/faqs" ua
          probe "KS 支援額(stats.json)" "$KS/stats.json?v=1" ua
          probe "KS 埋め込み(oEmbed)" "https://www.kickstarter.com/services/oembed?url=$KS" ua
          probe "KS 埋め込みカード" "$KS/widget/card.html?v=2" ua
          probe "KS 更新の配信(atom)" "$KS/posts.atom" ua
          probe "KS 画像(i.kickstarter.com)" "https://i.kickstarter.com/assets/055/250/517/568fae43b7e3e4a9788706774b8d6c5c_original.jpg?fit=scale-down&origin=ugc&q=92&v=1790243129&width=680&sig=jmvncY4ZQcmF9GR9zWHSi95hYvMrL1R5cU4iFM1P4VU%3D" ua
          probe "KS 新着一覧(discover)" "https://www.kickstarter.com/discover/advanced?category_id=16&sort=newest" ua
          probe "Kicktraq" "https://www.kicktraq.com/projects/sparkring/spark-ring-the-smart-ring-built-to-capture-ideas-instantly/" ua
          probe "Indiegogo トップ" "https://www.indiegogo.com/" ua
          probe "Crowd Supply" "https://www.crowdsupply.com/" ua
          probe "cnx-software" "https://www.cnx-software.com/" ua
          probe "cnx-software RSS" "https://www.cnx-software.com/feed/" ua
          probe "Liliputing" "https://liliputing.com/" ua
          probe "Notebookcheck" "https://www.notebookcheck.net/" ua
          echo
          echo "このランナーの外向きIPの所属:"
          curl -s --max-time 10 https://ipinfo.io/org || true
